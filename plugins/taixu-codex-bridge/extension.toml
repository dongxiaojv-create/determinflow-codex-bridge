[extension]
id = "taixu-codex-bridge"
name = "Codex Bridge"
version = "0.3.9"
api_version = "1"
backend = "determinflow_codex_bridge.taixu_bridge:create_extension"
capabilities = ["model.providers", "api.routes"]
description = "Use your own local Codex CLI login in DeterminFlow. macOS Apple Silicon preview."

[settings]
schema = "settings.schema.json"

[page]
label = "Codex 账户与用量"
static_dir = "ui"
entrypoint = "index.html"

[lifecycle]
migrate_command = ["${PYTHON}", "${PLUGIN_DIR}/determinflow_codex_bridge/setup_runtime.py", "${DATA_DIR}", "${CONFIG_FILE}"]
timeout_seconds = 300
