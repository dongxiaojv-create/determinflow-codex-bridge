[extension]
id = "taixu-codex-bridge"
name = "Codex Bridge"
version = "0.3.1"
api_version = "1"
backend = "determinflow_codex_bridge.taixu_bridge:create_extension"
capabilities = ["model.providers", "api.routes"]
